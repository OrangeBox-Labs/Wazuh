<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172b4d}.h{font-size:42px;font-weight:700}.t{font-size:24px}.s{font-size:19px}.b{stroke:#345;stroke-width:3;rx:18}</style><text x="800" y="60" text-anchor="middle" class="h">FIM → YARA → IOC</text><text x="800" y="100" text-anchor="middle" class="s">Detección selectiva para archivos nuevos o modificados en zonas de alto riesgo</text><rect x="35" y="145" width="260" height="250" class="b" fill="#e8f4ff"/><text x="165" y="190" text-anchor="middle" class="h">FIM</text><text x="65" y="245" class="t">554 / 550</text><text x="65" y="285" class="s">archivo nuevo/modificado</text><text x="65" y="325" class="s">en rutas monitorizadas</text><path d="M295 270h80" stroke="#1683c6" stroke-width="8"/><rect x="375" y="145" width="280" height="250" class="b" fill="#fff4df"/><text x="515" y="190" text-anchor="middle" class="h">10420 / 10421</text><text x="405" y="250" class="s">filtra scripts y formatos</text><text x="405" y="285" class="s">potencialmente peligrosos</text><path d="M655 270h80" stroke="#e08a00" stroke-width="8"/><rect x="735" y="145" width="280" height="250" class="b" fill="#eef8ef"/><text x="875" y="190" text-anchor="middle" class="h">YARA</text><text x="765" y="250" class="s">webshells_index.yar</text><text x="765" y="285" class="s">malware_index.yar</text><text x="765" y="325" class="s">resultado → decoder → 10501</text><path d="M1015 270h80" stroke="#2b9b63" stroke-width="8"/><rect x="1095" y="145" width="470" height="250" class="b" fill="#f4effc"/><text x="1330" y="190" text-anchor="middle" class="h">IOC + contexto</text><text x="1125" y="245" class="s">hash / IP / dominio malicioso</text><text x="1125" y="285" class="s">comportamiento correlacionado</text><text x="1125" y="325" class="s">alerta o respuesta precisa</text><rect x="80" y="475" width="1440" height="285" class="b" fill="#f8fafc"/><text x="800" y="525" text-anchor="middle" class="h">¿Dónde analizamos?</text><text x="120" y="585" class="t">/tmp</text><text x="120" y="625" class="t">/var/tmp</text><text x="120" y="665" class="t">/dev/shm</text><text x="480" y="585" class="t">/opt/zimbra/data/tmp</text><text x="480" y="625" class="t">/opt/zextras/data/tmp</text><text x="900" y="585" class="t">php · jsp · py · pl · sh</text><text x="900" y="625" class="t">cgi · asp · aspx · war · class</text><text x="800" y="710" text-anchor="middle" class="s">No se escanea todo el filesystem: primero reducimos el universo y después analizamos contenido.</text></svg>