<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172b4d}.h{font-size:42px;font-weight:700}.t{font-size:24px}.s{font-size:19px}.b{stroke:#345;stroke-width:3;rx:20}</style><text x="800" y="65" text-anchor="middle" class="h">De la señal al bloqueo</text><text x="800" y="105" text-anchor="middle" class="s">No todo se bloquea: la respuesta depende de la evidencia y del contexto</text><rect x="40" y="155" width="340" height="560" class="b" fill="#eaf4ff"/><text x="210" y="205" text-anchor="middle" class="h">1 · Evidencia</text><text x="80" y="275" class="t">archivo nuevo</text><text x="80" y="320" class="t">login SSH</text><text x="80" y="365" class="t">HTTP 401/403</text><text x="80" y="410" class="t">SYN</text><text x="80" y="455" class="t">evento de sistema</text><text x="80" y="530" class="s">Un evento individual es</text><text x="80" y="558" class="s">una señal, no necesariamente</text><text x="80" y="586" class="s">un ataque confirmado.</text><path d="M380 430h70" stroke="#1683c6" stroke-width="9"/><rect x="450" y="155" width="340" height="560" class="b" fill="#fff1e8"/><text x="620" y="205" text-anchor="middle" class="h">2 · Comportamiento</text><text x="490" y="275" class="t">10 × 401/403 / 15 s</text><text x="490" y="325" class="t">12 SYN / 90 s</text><text x="490" y="375" class="t">60 SYN / 10 s</text><text x="490" y="425" class="t">3 SSH / 5 min</text><text x="490" y="505" class="s">Correlación + umbral</text><text x="490" y="535" class="s">convierten señales aisladas</text><text x="490" y="565" class="s">en comportamiento sospechoso.</text><path d="M790 430h70" stroke="#e08a00" stroke-width="9"/><rect x="860" y="155" width="340" height="560" class="b" fill="#f2edfc"/><text x="1030" y="205" text-anchor="middle" class="h">3 · Confirmación</text><text x="900" y="285" class="t">IOC conocido</text><text x="900" y="335" class="t">hash malicioso</text><text x="900" y="385" class="t">coincidencia YARA</text><text x="900" y="465" class="s">Comportamiento + contexto</text><text x="900" y="495" class="s">aumentan la confianza de</text><text x="900" y="525" class="s">la detección.</text><path d="M1200 430h70" stroke="#6d4bc0" stroke-width="9"/><rect x="1270" y="155" width="290" height="560" class="b" fill="#edf8ef"/><text x="1415" y="205" text-anchor="middle" class="h">4 · Acción</text><text x="1305" y="285" class="t">firewall-drop</text><text x="1305" y="345" class="t">cuarentena</text><text x="1305" y="405" class="t">solo alerta</text><text x="1305" y="485" class="s">La respuesta se elige</text><text x="1305" y="515" class="s">según el tipo de amenaza.</text><text x="800" y="805" text-anchor="middle" class="h">Objetivo: máxima utilidad, mínimo ruido y respuestas precisas.</text></svg>