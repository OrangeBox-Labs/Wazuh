<ossec_config>

  <!-- OrangeBox Wazuh Manager configuration -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>no</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>

    <email_notification>yes</email_notification>
    <smtp_server>localhost</smtp_server>
    <email_from>wazuh@example.com</email_from>
    <email_to>soporte@example.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.json</email_log_source>

    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <update_check>yes</update_check>

    <!--
        Hosts de infraestructura confiable.

        Estas direcciones se excluyen del procesamiento normal de ciertas
        detecciones globales de Wazuh. Se mantienen aquí documentadas para
        dejar claro por qué cada equipo está en la whitelist.
    -->

    <!-- Localhost del propio Wazuh Manager -->
        <!--
        Infraestructura de confianza para funciones globales del Manager.

        IMPORTANTE:
        Los reverse proxies NO se incluyen aquí. Sus excepciones pertenecen
        exclusivamente a las reglas web de OrangeBox, porque solo deben
        modificar el tratamiento de detecciones HTTP.
    -->

    <!-- Localhost del propio Wazuh Manager -->
    <white_list>127.0.0.1</white_list>

    <!-- Zabbix Server - monitoreo -->
    <white_list>192.0.2.240</white_list>

    <!-- Zabbix Server - IP publica -->
    <white_list>203.0.113.148</white_list>


    <!-- Wazuh Manager -->
    <white_list>192.0.2.160</white_list>

    <!-- Zabbix Proxy de JHG -->
    <white_list>192.0.2.4</white_list>
  </global>

  <alerts>
    <!--
        La regla nativa Wazuh 651 (firewall-drop Active Response) es nivel 3.
        Los reportes OrangeBox necesitan conservar estos eventos.
        Por eso log_alert_level se fija en 3.

        No se eleva artificialmente la 651. La regla hija OrangeBox 10458
        usa nivel 11, inmediatamente por debajo del nivel 12 configurado
        en la integracion custom-orangebox-email.py. El bloqueo queda
        registrado para reportería, pero la integracion no lo procesa.
        email_alert_level es independiente y no controla esta integracion.
    -->
    <log_alert_level>3</log_alert_level>
    <email_alert_level>16</email_alert_level>
  </alerts>

  <!-- Formato de los logs internos del Manager; no cambia la salida JSON de alertas. -->
  <logging>
    <log_format>plain</log_format>
  </logging>

  <!-- Receptor seguro de eventos de agentes: TCP/1514. -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Revisión periódica de indicadores locales de rootkits, archivos y servicios sospechosos. -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
    <ignore>/var/lib/containerd</ignore>
    <ignore>/var/lib/docker/overlay2</ignore>
  </rootcheck>

  <!-- CIS-CAT está deshabilitado; SCA es el evaluador de configuración actualmente utilizado. -->
  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>
    <java_path>wodles/java</java_path>
    <ciscat_path>wodles/ciscat</ciscat_path>
  </wodle>

  <!-- Osquery permanece deshabilitado; se conserva el bloque para una activación futura controlada. -->
  <wodle name="osquery">
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <!-- Inventario de hardware, sistema operativo, red, paquetes, puertos y procesos de los agentes. -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <!-- Security Configuration Assessment: ejecuta los benchmarks de configuración distribuidos al agente. -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- Motor nativo de Wazuh para correlacionar paquetes del inventario con CVE conocidos. -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <!-- Conexión TLS del Manager al Indexer usado por inventario, vulnerabilidades y búsquedas. -->
  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/filebeat/certs/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/filebeat/certs/wazuh-server.pem</certificate>
      <key>/etc/filebeat/certs/wazuh-server-key.pem</key>
    </ssl>
  </indexer>

  <!-- FIM global del Manager; el alcance detallado de cada endpoint se define en los perfiles compartidos. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>
    <nodiff>/etc/ssl/private.key</nodiff>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <max_eps>50</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- Active Response commands -->
  <!-- Comando nativo para deshabilitar cuentas cuando una regla lo solicita. -->
  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Comando nativo para reiniciar el servicio Wazuh cuando una respuesta lo requiere. -->
  <command>
    <name>restart-wazuh</name>
    <executable>restart-wazuh</executable>
  </command>

  <!-- Bloquea temporalmente una IP de origen en el firewall del agente que ejecuta la respuesta. -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>

  <!-- Añade una IP de origen a los controles host-deny compatibles. -->
  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>

  <!-- Descarta una ruta hacia la IP de origen; se mantiene disponible para reglas que lo utilicen. -->
  <command>
    <name>route-null</name>
    <executable>route-null</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>

  <!-- Variante Windows de route-null. -->
  <command>
    <name>win_route-null</name>
    <executable>route-null.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>

  <!-- Comando de respuesta para acciones firewall basadas en netsh en endpoints Windows. -->
  <command>
    <name>netsh</name>
    <executable>netsh.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>


  <command>
    <name>orangebox-yara</name>
    <executable>orangebox-yara.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <!-- Quarantine confirmed malware files detected by native Wazuh IOC rule 99901 -->
  <command>
    <name>orangebox-quarantine</name>
    <executable>orangebox-quarantine.py</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <!-- FIM -> YARA: scan candidate web/script files created or modified -->
  <active-response>
    <disabled>no</disabled>
    <command>orangebox-yara</command>
    <location>local</location>
    <rules_id>10420,10421</rules_id>
  </active-response>

  <!-- Confirmed malware hash: preserve, verify, chmod 0400, then quarantine the file -->
  <active-response>
    <disabled>no</disabled>
    <command>orangebox-quarantine</command>
    <location>local</location>
    <rules_id>99901</rules_id>
  </active-response>

  <!-- Any source-IP IOC match with a decoded srcip: immediate 7-day containment.
       Native Wazuh rules 99903-99905, 99907-99908, 99911-99914 plus
       OrangeBox IOC correlations 10460-10463. -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10460,10461,10462,10463,99903,99904,99905,99907,99908,99911,99912,99913,99914</rules_id>
    <timeout>604800</timeout>
  </active-response>

  <!-- High-confidence web exploitation attempt from a known malicious IOC.
       HTTP 200 does not prove code execution, but the source gets a stronger
       30-day containment policy. -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>99906,10053</rules_id>
    <timeout>2592000</timeout>
  </active-response>

  <!-- SSH brute force -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5720</rules_id>
    <timeout>180</timeout>
  </active-response>

  <!-- SSH brute force followed by successful authentication -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10006</rules_id>
    <timeout>86400</timeout>
  </active-response>

  <!-- Mail brute force: múltiples fallos de autenticacion -> firewall-drop por 24h -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10700,10701</rules_id>
    <timeout>86400</timeout>
  </active-response>

  <!-- Shellshock / web exploit direct response -->
  <!--
       31166/31167 = Shellshock en respuestas 4xx/5xx.
       31168/31169 = Shellshock en respuestas 2xx/3xx.
       Un Shellshock detectado es una señal de explotación suficientemente
       específica para bloquear inmediatamente el origen.
  -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>31166,31167,31168,31169</rules_id>
    <timeout>86400</timeout>
  </active-response>

  <!-- Correlacion de multiples tecnicas de ataque web -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10029</rules_id>
    <timeout>86400</timeout>
  </active-response>

  <!-- Intento específico de acceso a credenciales de metadatos cloud: bloquear origen por 24 horas -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10039</rules_id>
    <timeout>86400</timeout>
  </active-response>

  <!-- Web sensitive-file discovery -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10026</rules_id>
    <timeout>86400</timeout>
  </active-response>

  <!-- Web brute force: 10 HTTP 401/403 responses from the same source IP -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10025</rules_id>
    <timeout>86400</timeout>
  </active-response>

  <!-- TCP port scan: block the source IP for 1 hour -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10456</rules_id>
    <timeout>3600</timeout>
  </active-response>

  <!-- SYN flood from one source: 10454 is the final detection and blocks for 1 hour -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10454</rules_id>
    <timeout>3600</timeout>
  </active-response>

  <!-- Incident-derived web reconnaissance: only high-confidence remote sources.
       The rules themselves exclude validated reverse proxies. -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_group>orangebox_web_auto_block,</rules_group>
    <timeout>86400</timeout>
  </active-response>

  <!-- Incident-derived SYN-RECV pressure: block only a persistent single source.
       Distributed pressure is detected but intentionally not auto-blocked here. -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_group>orangebox_syn_flood_block,</rules_group>
    <timeout>3600</timeout>
  </active-response>

  <!-- Telemetría local: uso de filesystem para inventario/diagnóstico del Manager y agentes configurados. -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <!-- Telemetría local: sockets y puertos en escucha, normalizados para el decoder de inventario. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/\[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>

  <!-- Telemetría local: últimos inicios de sesión para enriquecer el contexto de autenticación. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>360</frequency>
  </localfile>

  <!-- Carga decoders, reglas OrangeBox y CDB utilizadas por las detecciones y whitelists. -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/orangebox-cpanel-agents</list>
    <list>etc/lists/orangebox-zimbra-agents</list>
    <list>etc/lists/orangebox-dns-agents</list>
    <list>etc/lists/orangebox-backuppc-static</list>
    <list>etc/lists/orangebox-backuppc-dynamic</list>
    <list>etc/lists/orangebox-sftp-authorized</list>
    <list>etc/lists/orangebox-web-auth-proxies</list>
    <list>etc/lists/orangebox-web-discovery-proxies</list>
    <list>etc/lists/orangebox-suspicious-programs</list>
    <list>etc/lists/orangebox-recon-programs</list>
    <list>etc/lists/orangebox-network-recon-programs</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- Habilita el servicio interactivo wazuh-logtest para validar reglas en el Manager. -->
  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <!-- Servicio de registro y enrolamiento seguro de nuevos agentes. -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <ciphers>ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:TLS_AES_256_GCM_SHA384</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <!-- Configuración de clúster; disabled=yes mantiene este Manager como nodo independiente. -->
  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key></key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>NODE_IP</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>


  <!-- Fuente local de eventos systemd/journald. -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <!-- Eventos auditd del Manager; los agentes mantienen su propio audit log según perfil. -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Resultado de ejecuciones Active Response para correlación y auditoría. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- Entrada JSONL del detector complementario de vulnerabilidades. -->
  <!-- Eventos JSON consolidados producidos por el detector complementario de vulnerabilidades. -->
  <localfile>
    <location>/var/ossec/logs/vulnerability-alerts/events.jsonl</location>
    <log_format>json</log_format>
  </localfile>

  <!-- Integración HTML OrangeBox; procesa alertas desde el nivel indicado en level. -->
  <integration>
    <name>custom-orangebox-email.py</name>
    <hook_url>soporte@example.com</hook_url>
    <level>12</level>
    <alert_format>json</alert_format>
  </integration>
</ossec_config>
