<agent_config>
  <!--
      OrangeBox - Perfil FIM Zimbra / Carbonio CE.

      El perfil se mantiene con el nombre funcional "zimbra" porque asi lo
      consume la CDB de reglas. Carbonio utiliza el mismo perfil.

      El FIM base comun se incluye aqui; este grupo es el
      unico encargado de esas rutas.
  -->

  <labels>
    <label key="orangebox.profile">zimbra</label>
  </labels>

  <syscheck>
    <!-- Limite explicito de entradas FIM. 175000 ≈ objetivo de ~128 MiB segun el volumen actual. -->
    <file_limit>
      <enabled>yes</enabled>
      <entries>175000</entries>
    </file_limit>

    <!--
        Recorta los bloques FIM por defecto que normalmente trae el
        ossec.conf local del agente.
        
        Wazuh procesa ossec.conf antes que agent.conf. Estas dos entradas
        reproducen los grupos de paths del default y los restringen por
        nombre de archivo, evitando que /etc y los árboles de binarios
        vuelvan a quedar completos.
    -->
    <directories restrict="passwd|shadow|group|gshadow|sudoers|sudoers.conf|securetty|fstab|hosts|resolv.conf|nsswitch.conf|crypttab|sysctl.conf|crontab|anacrontab|profile|bashrc|ld.so.preload|modules|rc.local|login.defs|subuid|subgid|sudo$|su$|chage$|chsh$|newgrp$|useradd$|usermod$|userdel$|groupadd$|groupmod$|groupdel$|pkexec$|mount$|umount$|sshd$|login$">/etc,/usr/bin,/usr/sbin</directories>
    <directories restrict="sudo$|su$|passwd$|chage$|chsh$|newgrp$|useradd$|usermod$|userdel$|groupadd$|groupmod$|groupdel$|pkexec$|mount$|umount$|sshd$|login$|vmlinuz|initramfs|grub.cfg">/bin,/sbin,/boot</directories>

    <!-- Alertar ante archivos nuevos. Es especialmente importante en
         temporales y webroots, donde el atacante puede introducir payloads. -->
    <alert_new_files>yes</alert_new_files>

    <!-- ==============================================================
         1. ZONAS TEMPORALES / STAGING
         ==============================================================
         Realtime + alcance recursivo acotado.
         No report_changes: YARA recibe candidatos de script/webshell y
         guardar diffs de todo lo que pasa por /tmp seria contraproducente.
    -->
    <directories realtime="yes" recursion_level="3">/tmp</directories>
    <directories realtime="yes" recursion_level="3">/var/tmp</directories>
    <directories realtime="yes" recursion_level="3">/dev/shm</directories>

    <!-- ==============================================================
         2. CREDENCIALES Y ACCESO
         ==============================================================
         .ssh realtime + Who-Data, sin diff para no exponer material sensible.
         Archivos de identidad se controlan por hash en scans programados.
    -->
    <directories realtime="yes" whodata="yes">/root/.ssh,/home/*/.ssh</directories>

    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/ssh</directories>
    <nodiff>/etc/ssh/ssh_host_.*_key</nodiff>
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/sudoers.d</directories>
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/pam.d</directories>
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/polkit-1</directories>
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/security</directories>

    <!-- Archivos sensibles: monitoreo programado + Who-Data, sin diff. -->
    <directories whodata="yes" report_changes="yes">/etc/passwd,/etc/group</directories>
    <directories whodata="yes">/etc/shadow,/etc/gshadow</directories>
    <directories whodata="yes" report_changes="yes">/etc/sudoers,/etc/sudoers.conf,/etc/securetty</directories>
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>

    <!-- ==============================================================
         3. PERSISTENCIA / EJECUCION AUTOMATICA
         ==============================================================
    -->
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/systemd/system,/etc/systemd/user</directories>
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/cron.d,/etc/cron.hourly,/etc/cron.daily,/etc/cron.weekly,/etc/cron.monthly</directories>
    <directories realtime="yes" whodata="yes">/var/spool/cron</directories>
    <directories report_changes="yes" whodata="yes">/etc/crontab,/etc/anacrontab</directories>

    <!-- Shell startup y loader: mecanismos clasicos de persistencia. -->
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/profile.d</directories>
    <directories report_changes="yes" whodata="yes">/etc/profile,/etc/bashrc,/etc/bash.bashrc,/root/.bashrc,/root/.bash_profile,/root/.profile</directories>
    <directories report_changes="yes" whodata="yes">/home/*/.bashrc,/home/*/.bash_profile,/home/*/.profile</directories>
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/ld.so.conf.d</directories>
    <directories report_changes="yes" whodata="yes">/etc/ld.so.preload</directories>

    <!-- Carga de modulos y reglas udev: persistencia a nivel kernel/dispositivo. -->
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/modprobe.d,/etc/modules-load.d,/etc/udev/rules.d</directories>
    <directories report_changes="yes" whodata="yes">/etc/modules,/etc/rc.local,/etc/rc.d/rc.local</directories>

    <!-- ==============================================================
         4. RED, DNS, MONTAJES Y SEGURIDAD DEL KERNEL
         ==============================================================
    -->
    <directories report_changes="yes" whodata="yes">/etc/hosts,/etc/resolv.conf,/etc/nsswitch.conf,/etc/fstab,/etc/crypttab,/etc/sysctl.conf,/etc/login.defs,/etc/subuid,/etc/subgid</directories>
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/authselect,/etc/audit/rules.d,/etc/rsyslog.d</directories>
    <directories report_changes="yes" whodata="yes">/etc/audit/auditd.conf,/etc/rsyslog.conf,/etc/selinux/config</directories>
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/sysctl.d</directories>

    <!-- CA anchors: alterar la cadena de confianza puede crear persistencia. -->
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/pki/ca-trust/source/anchors</directories>
    <directories realtime="yes" report_changes="yes" whodata="yes">/usr/local/share/ca-certificates</directories>

    <!-- ==============================================================
         5. FIREWALL
         ==============================================================
    -->
    <directories realtime="yes" report_changes="yes" whodata="yes">/etc/firewalld,/etc/nftables,/etc/ufw,/etc/shorewall</directories>
    <directories report_changes="yes" whodata="yes">/etc/nftables.conf,/etc/sysconfig/nftables,/etc/sysconfig/nftables.conf,/etc/sysconfig/iptables</directories>

    <!-- ==============================================================
         6. BINARIOS CRITICOS
         ==============================================================
         No realtime ni diff: se controla integridad por hashes en scans
         programados. restrict reduce el universo a utilidades vinculadas
         a autenticacion, identidad, privilegios y montaje.
    -->
    <directories check_all="yes" restrict="^(sudo|su|passwd|chage|chsh|newgrp|useradd|usermod|userdel|groupadd|groupmod|groupdel|pkexec|mount|umount)$">/bin,/usr/bin</directories>
    <directories check_all="yes" restrict="^(sshd|login|sudo|su|passwd|useradd|usermod|userdel|groupadd|groupmod|groupdel)$">/sbin,/usr/sbin</directories>

    <!-- Los binarios/librerias generales no se vigilan por defecto.
         La vulnerabilidad y el reemplazo de componentes del sistema se
         cubren adicionalmente mediante Syscollector/rootcheck/paquetizacion.
    -->

    <!-- ==============================================================
         PERFIL ESPECIFICO
         ==============================================================
    -->
<!--
         TEMPORALES INTERNOS DEL PRODUCTO (EXCLUIDOS)

         No se aplica FIM a /opt/zimbra/data/tmp ni a
         /opt/zextras/data/tmp. Son zonas de procesamiento/cache con
         archivos efimeros que no se pueden atribuir de forma fiable
         a un mensaje. Las reglas 10420/10421 tampoco disparan YARA
         sobre estas rutas.
    -->

    <!-- ==============================================================
         1. CAPA WEB / JETTY
         ==============================================================
         Un JSP/JSPX/WAR nuevo o modificado dentro de webapps es un
         candidato importante para webshell o modificacion de la aplicacion.
    -->
    <directories realtime="yes" restrict="\.(?:jsp|jspx|war|class)$">/opt/zimbra/jetty/webapps,/opt/zextras/jetty/webapps</directories>
    
    <!-- ==============================================================
         2. CONFIGURACION DEL SERVICIO
         ==============================================================
         Se necesita detectar cambios rapidamente, pero NO se guarda diff
         de arboles que pueden incluir credenciales internas.
    -->
    <directories realtime="yes" whodata="yes">/opt/zimbra/conf,/opt/zextras/conf</directories>
    <directories realtime="yes" whodata="yes">/opt/zimbra/ssl,/opt/zextras/ssl</directories>
    <nodiff>/opt/zimbra/ssl/.*</nodiff>
    <nodiff>/opt/zextras/ssl/.*</nodiff>
    
    <!-- ==============================================================
         3. BINARIOS PRIVILEGIADOS / COMANDOS DE SUDO
         ==============================================================
         Se protege exactamente el conjunto actualmente utilizado por la
         whitelist de orangebox-auth.xml. restrict permite realtime sin
         indexar todo /opt/zimbra ni /opt/zextras.
    -->
    <directories realtime="yes" whodata="yes" restrict="^(zmstat-fd|zmqstat|zmmtastatus|zmmailboxdmgr|zmconfigd)$">/opt/zimbra/libexec,/opt/zextras/libexec</directories>
    <directories realtime="yes" whodata="yes" restrict="^(postfix|postalias|qshape\.pl|postconf|postsuper|postcat)$">/opt/zimbra/common/sbin,/opt/zextras/common/sbin</directories>
  </syscheck>

    <!--
        7. CORREO: LOG MTA CONSOLIDADO

        Zimbra registra Postfix y Amavis en /var/log/zimbra.log.
        Carbonio CE concentra la actividad MTA/syslog en /var/log/carbonio.log.
        El grupo zimbra incluye ambas variantes; cada servidor usa la ruta
        correspondiente a su producto. Solo se leen eventos nuevos al activar
        la fuente para no importar historicos.
        
        No recopilar mailbox.log: contiene actividad del mailbox y puede
        introducir un volumen elevado de datos de usuario sin aportar la
        trazabilidad SMTP/Amavis que buscamos en esta fase.
    -->
    <localfile>
      <location>/var/log/zimbra.log</location>
      <log_format>syslog</log_format>
      <only-future-events>yes</only-future-events>
    <restrict type="PCRE2">(?i)(?:^|\s)(?:postfix/(?:smtpd|smtps/smtpd|submission/smtpd|cleanup|qmgr|smtp|lmtp|anvil|amavisd/smtpd|pickup|local|virtual|error|bounce)|amavis(?:d)?|spamd|clamd|freshclam)(?:\[\d+\])?:</restrict>
    <ignore type="PCRE2">(?i)postfix/dkimmilter/</ignore>
      <ignore type="PCRE2">(?i)postfix/(?:submission/|smtps/)?smtpd\[\d+\]:\s*(?:[0-9a-f]{4}\s+(?:[0-9a-f]{2}\s*){1,16}(?:\||$)|read from\b|write to\b|SSL_accept:|.*Issuing session ticket)</ignore>
      </localfile>

    <localfile>
      <location>/var/log/carbonio.log</location>
      <log_format>syslog</log_format>
      <only-future-events>yes</only-future-events>
    <restrict type="PCRE2">(?i)(?:^|\s)(?:postfix/(?:smtpd|smtps/smtpd|submission/smtpd|cleanup|qmgr|smtp|lmtp|anvil|amavisd/smtpd|pickup|local|virtual|error|bounce)|amavis(?:d)?|spamd|clamd|freshclam)(?:\[\d+\])?:</restrict>
    <ignore type="PCRE2">(?i)postfix/dkimmilter/</ignore>
      <ignore type="PCRE2">(?i)postfix/(?:submission/|smtps/)?smtpd\[\d+\]:\s*(?:[0-9a-f]{4}\s+(?:[0-9a-f]{2}\s*){1,16}(?:\||$)|read from\b|write to\b|SSL_accept:|.*Issuing session ticket)</ignore>
      </localfile>


    <!-- Zimbra deployments can write Postfix/Amavis to maillog instead of zimbra.log. -->
    <localfile>
      <location>/var/log/maillog</location>
      <log_format>syslog</log_format>
      <only-future-events>yes</only-future-events>
      <restrict type="PCRE2">(?i)(?:^|\s)(?:postfix/(?:smtpd|smtps/smtpd|submission/smtpd|cleanup|qmgr|smtp|lmtp|anvil|amavisd/smtpd|pickup|local|virtual|error|bounce)|amavis(?:d)?|spamd|clamd|freshclam)(?:\[\d+\])?:</restrict>
      <ignore type="PCRE2">(?i)postfix/dkimmilter/</ignore>
      <ignore type="PCRE2">(?i)postfix/(?:submission/|smtps/)?smtpd\[\d+\]:\s*(?:[0-9a-f]{4}\s+(?:[0-9a-f]{2}\s*){1,16}(?:\||$)|read from\b|write to\b|SSL_accept:|.*Issuing session ticket)</ignore>
    </localfile>


    <localfile>
      <location>/opt/z*/log/clamd.log</location>
      <log_format>syslog</log_format>
      <only-future-events>yes</only-future-events>
      <restrict type="PCRE2">(?i)\b(?:FOUND|ERROR|WARNING)\b</restrict>
    </localfile>

    <localfile>
      <location>/opt/z*/log/freshclam.log</location>
      <log_format>syslog</log_format>
      <only-future-events>yes</only-future-events>
      <restrict type="PCRE2">(?i)(?:\bERROR:|WARNING:.*(?:OUTDATED|update process failed|database.*(?:failed|not updated)))</restrict>
    </localfile>

</agent_config>
