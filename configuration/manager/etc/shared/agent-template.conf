<agent_config>
  <!--
      OrangeBox - Wazuh shared agent-group template

      Este archivo es utilizado por el framework del Wazuh Manager al crear
      un nuevo Agent Group.

      El Manager espera encontrar esta plantilla en runtime como:
          /var/ossec/etc/shared/agent-template.conf

      Cuando se crea un grupo, Wazuh copia esta plantilla como:
          /var/ossec/etc/shared/<GROUP>/agent.conf

      Por eso la plantilla debe existir aunque inicialmente el grupo no tenga
      ninguna configuracion centralizada.

      IMPORTANTE:
          - No poner aqui FIM, labels, localfile u otras politicas de un
            perfil concreto.
          - Las politicas funcionales viven en el agent.conf del grupo.
          - Este archivo existe para permitir la creacion limpia de grupos.
  -->
</agent_config>
