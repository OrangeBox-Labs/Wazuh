# OrangeBox - opciones internas locales del Wazuh Manager
#
# Estas opciones aplican EXCLUSIVAMENTE al Wazuh Manager.
#
# Firewall interno de Wazuh:
# no generar /var/ossec/logs/firewall/firewall.log.
# Esto no deshabilita firewall-drop ni las alertas JSON.
analysisd.log_fw=0

# Logging interno del Manager:
# rotacion diaria, compresion y retencion de 7 dias.
monitord.rotate_log=1
monitord.compress=1
monitord.keep_log_days=7

# Debug desactivado en operacion normal.
# Subir temporalmente solo durante troubleshooting.
analysisd.debug=0
remoted.debug=0
monitord.debug=0
